<!DOCTYPE html>
<html lang="en">
<head>
    <script src="debug-console.js"></script>
    <script src="auth-check.js"></script>
    <link rel="icon" type="image/png" href="logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call - Together</title>
    <!-- Include PeerJS for WebRTC signaling -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* bg handled by global */
            /* color handled by global */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px;
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
        }

        .back-btn {
            background: var(--card-bg);
            border: none;
            color: var(--dark-color);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: var(--card-bg);
        }

        h1 {
            flex: 1;
            text-align: center;
            font-size: 1.5rem;
            margin-right: 40px; /* balance out the back button */
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* Video Container */
        .video-container {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none; /* hidden until connected in video mode */
        }

        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #localVideo {
            width: 120px;
            height: 160px;
            position: absolute;
            bottom: 20px;
            right: 20px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.5);
            background: #333;
        }

        /* Status UI (Incoming/Outgoing/Voice) */
        .status-ui {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff4b90, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(255, 75, 144, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 75, 144, 0.4); }
            70% { box-shadow: 0 0 0 30px rgba(255, 75, 144, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 75, 144, 0); }
        }

        .status-text {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .status-subtext {
            font-size: 1rem;
            opacity: 0.7;
            margin-bottom: 40px;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 20px;
            margin-top: auto;
            padding: 30px;
            background: rgba(0, 0, 0, 0.3);
            width: 100%;
            justify-content: center;
            border-radius: 20px 20px 0 0;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            color: var(--dark-color);
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .btn-mic, .btn-video {
            background: var(--card-bg);
        }

        .btn-mic:hover, .btn-video:hover {
            background: var(--card-bg);
        }

        .btn-mic.muted, .btn-video.muted {
            background: #ff4b4b;
        }

        .btn-end {
            background: #ff4b4b;
        }

        .btn-end:hover {
            background: #ff2d2d;
            transform: scale(1.1);
        }

        .btn-answer {
            background: #4cd964;
            display: none;
        }

        .btn-answer:hover {
            background: #3cb852;
            transform: scale(1.1);
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: var(--dark-color);
            padding: 10px 20px;
            border-radius: 20px;
            z-index: 1000;
            display: none;
        }
    </style>
    <link rel="stylesheet" href="global-style.css">
</head>
<body>
    <div class="toast" id="toast">Connecting...</div>

    <div class="header">
        <button class="back-btn" onclick="goBack()">←</button>
        <h1 id="headerTitle">Connecting...</h1>
    </div>

    <div class="main-content">
        <div class="status-ui" id="statusUi">
            <div class="avatar" id="avatarIcon">📞</div>
            <div class="status-text" id="statusText">Initializing...</div>
            <div class="status-subtext" id="statusSubtext">Please wait</div>
        </div>

        <div class="video-container" id="videoContainer">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
    </div>

    <div class="controls">
        <button class="control-btn btn-mic" id="btnMic" onclick="toggleMic()" title="Mute Microphone">🎤</button>
        <button class="control-btn btn-video" id="btnVideo" onclick="toggleVideo()" title="Toggle Video" style="display:none;">📷</button>
        <button class="control-btn btn-answer" id="btnAnswer" onclick="answerCall()" title="Answer">📞</button>
        <button class="control-btn btn-end" id="btnEnd" onclick="endCall()" title="End Call">📵</button>
    </div>

    <script>
        const API_URL = "https://shrill-base-9781.dtechxpreas.workers.dev";
        let localUser = null;
        let peer = null;
        let localStream = null;
        let currentCall = null;

        let callMode = 'voice'; // 'voice' or 'video'
        let isIncoming = false;
        let isCalling = false;
        let callAttempts = 0;
        const maxCallAttempts = 20;

        const ui = {
            statusUi: document.getElementById('statusUi'),
            videoContainer: document.getElementById('videoContainer'),
            statusText: document.getElementById('statusText'),
            statusSubtext: document.getElementById('statusSubtext'),
            btnMic: document.getElementById('btnMic'),
            btnVideo: document.getElementById('btnVideo'),
            btnAnswer: document.getElementById('btnAnswer'),
            btnEnd: document.getElementById('btnEnd'),
            localVideo: document.getElementById('localVideo'),
            remoteVideo: document.getElementById('remoteVideo'),
            headerTitle: document.getElementById('headerTitle'),
            toast: document.getElementById('toast'),
            avatarIcon: document.getElementById('avatarIcon')
        };

        function showToast(msg) {
            ui.toast.textContent = msg;
            ui.toast.style.display = 'block';
            setTimeout(() => ui.toast.style.display = 'none', 3000);
        }

        function goBack() {
            if (currentCall) {
                endCall();
            } else {
                window.location.href = 'messages.html';
            }
        }

        async function initApp() {
            const savedProfile = localStorage.getItem('togetherProfile');
            if (!savedProfile) {
                window.location.href = 'index.html';
                return;
            }
            localUser = JSON.parse(savedProfile);

            const urlParams = new URLSearchParams(window.location.search);
            callMode = urlParams.get('mode') || 'voice'; // 'voice' or 'video'
            isIncoming = urlParams.get('incoming') === 'true';

            if (callMode === 'video') {
                ui.btnVideo.style.display = 'flex';
                ui.avatarIcon.textContent = '📷';
            }

            ui.headerTitle.textContent = `${callMode === 'video' ? 'Video' : 'Voice'} Call`;

            // Initialize PeerJS
            // We use a deterministic prefix to ensure jonas connects to owami easily
            const myPeerId = `together_${localUser.name.toLowerCase()}_2024`;

            peer = new Peer(myPeerId, {
                debug: 2
            });

            peer.on('open', (id) => {
                console.log('My peer ID is: ' + id);
                if (isIncoming) {
                    setupIncomingUI();
                } else {
                    startOutgoingCall();
                }
            });

            peer.on('call', (call) => {
                // Someone is calling us (in case they call while we are already on this page)
                console.log("Receiving incoming call from PeerJS...");
                currentCall = call;
                isIncoming = true;
                setupIncomingUI();
            });

            peer.on('error', (err) => {
                console.error("Peer error:", err.type, err);
                if (err.type === 'peer-unavailable') {
                    if (isCalling) {
                        console.log("Partner unavailable, retrying...");
                        retryCall();
                        return; // prevent showing error toast immediately
                    }
                }
                showToast(`Connection error: ${err.type}`);
                ui.statusText.textContent = "Connection Failed";
                ui.statusSubtext.textContent = err.type;
                isCalling = false;
            });
        }

        async function getMediaStream() {
            try {
                const constraints = {
                    audio: true,
                    video: callMode === 'video' ? { facingMode: "user" } : false
                };
                localStream = await navigator.mediaDevices.getUserMedia(constraints);

                if (callMode === 'video') {
                    ui.localVideo.srcObject = localStream;
                }
                return localStream;
            } catch (err) {
                console.error('Failed to get local stream', err);
                showToast('Could not access microphone/camera. Please check permissions.');
                ui.statusText.textContent = "Permission Denied";
                ui.statusSubtext.textContent = "Please allow camera/mic access";
                return null;
            }
        }

        async function startOutgoingCall() {
            ui.statusText.textContent = `Calling ${localUser.partner.name}...`;
            ui.statusSubtext.textContent = "Ringing...";

            // 1. Notify backend to trigger notification on partner's phone
            try {
                const callState = {
                    status: 'calling',
                    target: localUser.partner.name.toLowerCase(),
                    caller: localUser.name,
                    type: callMode,
                    timestamp: Date.now()
                };

                await window.authenticatedFetch(`${API_URL}/api/couple`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ callState })
                });
            } catch (e) {
                console.error("Failed to update backend call state", e);
            }

            // 2. Setup local media
            const stream = await getMediaStream();
            if (!stream) return;

            isCalling = true;
            callAttempts = 0;
            attemptCall();
        }

        function attemptCall() {
            if (!isCalling) return;
            const partnerPeerId = `together_${localUser.partner.name.toLowerCase()}_2024`;
            console.log("Attempting to call peer: ", partnerPeerId);

            currentCall = peer.call(partnerPeerId, localStream, {
                metadata: { mode: callMode }
            });

            if (currentCall) {
                handleCallEvents(currentCall);
            } else {
                retryCall();
            }
        }

        function retryCall() {
            if (!isCalling) return;
            callAttempts++;
            if (callAttempts >= maxCallAttempts) {
                ui.statusText.textContent = "Call Failed";
                ui.statusSubtext.textContent = "Partner is unreachable";
                isCalling = false;
                showToast("Partner is unavailable.");
                setTimeout(() => endCall(), 2000);
                return;
            }
            setTimeout(() => {
                if (isCalling) attemptCall();
            }, 3000);
        }

        function setupIncomingUI() {
            ui.statusText.textContent = `${localUser.partner.name} is calling...`;
            ui.statusSubtext.textContent = `Incoming ${callMode} call`;
            ui.btnAnswer.style.display = 'flex';
        }

        async function answerCall() {
            if (!currentCall) return;

            ui.btnAnswer.style.display = 'none';
            ui.statusText.textContent = "Connecting...";

            // Determine if the caller requested video
            if (currentCall.metadata && currentCall.metadata.mode === 'video') {
                callMode = 'video';
                ui.btnVideo.style.display = 'flex';
            }

            const stream = await getMediaStream();
            if (!stream) {
                currentCall.close();
                return;
            }

            currentCall.answer(stream);
            handleCallEvents(currentCall);

            // Clear callState from backend
            try {
                await window.authenticatedFetch(`${API_URL}/api/couple`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ callState: { status: 'answered', target: '' } })
                });
            } catch (e) {}
        }

        function handleCallEvents(call) {
            call.on('stream', (remoteStream) => {
                console.log("Received remote stream");
                isCalling = false; // Stop retrying
                ui.remoteVideo.srcObject = remoteStream;

                ui.statusUi.style.display = 'none';

                if (callMode === 'video') {
                    ui.videoContainer.style.display = 'block';
                } else {
                    ui.statusUi.style.display = 'flex';
                    ui.statusText.textContent = "Connected";
                    ui.statusSubtext.textContent = `Talking to ${localUser.partner.name}`;
                    ui.avatarIcon.style.animation = 'none';
                    ui.avatarIcon.style.boxShadow = '0 0 0 10px rgba(76, 217, 100, 0.4)';
                }
            });

            call.on('close', () => {
                console.log("Call closed by remote");
                handleCallEnded();
            });

            call.on('error', (err) => {
                console.error("Call error:", err);
                handleCallEnded();
            });
        }

        async function endCall() {
            isCalling = false;
            if (currentCall) {
                currentCall.close();
            }
            handleCallEnded();

            // Notify backend call ended
            try {
                await window.authenticatedFetch(`${API_URL}/api/couple`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ callState: { status: 'ended', target: '' } })
                });
            } catch (e) {}
        }

        function handleCallEnded() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            ui.videoContainer.style.display = 'none';
            ui.statusUi.style.display = 'flex';
            ui.statusText.textContent = "Call Ended";
            ui.statusSubtext.textContent = "";
            ui.btnAnswer.style.display = 'none';
            ui.avatarIcon.style.animation = 'none';
            ui.avatarIcon.style.boxShadow = 'none';

            setTimeout(() => {
                window.location.href = 'messages.html';
            }, 2000);
        }

        function toggleMic() {
            if (localStream) {
                const audioTrack = localStream.getAudioTracks()[0];
                if (audioTrack) {
                    audioTrack.enabled = !audioTrack.enabled;
                    ui.btnMic.classList.toggle('muted', !audioTrack.enabled);
                    ui.btnMic.textContent = audioTrack.enabled ? '🎤' : '🔇';
                }
            }
        }

        function toggleVideo() {
            if (localStream) {
                const videoTrack = localStream.getVideoTracks()[0];
                if (videoTrack) {
                    videoTrack.enabled = !videoTrack.enabled;
                    ui.btnVideo.classList.toggle('muted', !videoTrack.enabled);
                }
            }
        }

        window.onload = initApp;
    </script>
    <script src="birthday.js"></script>
</body>
</html>

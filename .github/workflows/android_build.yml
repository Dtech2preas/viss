name: Android CI/CD Auto Release

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # needed for good git history

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Get Short SHA
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Build Release APKs
      env:
        APP_VERSION_TAG: "v1.0-${{ steps.vars.outputs.sha_short }}"
      run: ./gradlew :app:assembleRelease

    - name: Sign APK
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "33.0.1"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v1.0-${{ steps.vars.outputs.sha_short }}"
        name: "Release v1.0-${{ steps.vars.outputs.sha_short }}"
        draft: false
        prerelease: false
        files: ${{ steps.sign_app.outputs.signedReleaseFile }}

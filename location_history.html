<!DOCTYPE html>
<html lang="en">
<head>
    <script src="debug-console.js"></script>
    <script src="auth-check.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link rel="icon" type="image/png" href="logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Together - Location History</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <style>


        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
    /* handled by global css */
}

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        header { text-align: center; padding: 20px 0; }
        h1 { font-family: 'Dancing Script', cursive; font-size: 3rem; color: var(--secondary-color); }

        .back-btn {
            position: absolute; top: 20px; left: 20px;
            background: var(--card-bg); border: none;
            color: var(--secondary-color); width: 50px; height: 50px;
            border-radius: 50%; font-size: 1.2rem; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1); z-index: 1000;
        }

        .controls {
            display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px;
        }

        .btn {
            background: var(--card-bg); border: 2px solid var(--primary-color);
            color: var(--primary-color); padding: 10px 20px; border-radius: 20px;
            cursor: pointer; transition: all 0.3s ease; font-weight: 500;
        }

        .btn.active {
            background: var(--primary-color); color: var(--dark-color);
        }

        #map {
            flex: 1; min-height: 500px; width: 100%; border-radius: 15px;
            box-shadow: 0 5px 15px rgba(166, 94, 166, 0.1); z-index: 1;
        }

        .stats-panel {
            background: var(--card-bg); padding: 15px; border-radius: 15px; margin-top: 20px;
            display: flex; justify-content: space-around;
            box-shadow: 0 5px 15px rgba(166, 94, 166, 0.1);
        }

        .stat { text-align: center; }
        .stat-val { font-size: 1.5rem; color: var(--secondary-color); font-weight: bold; }
        .stat-label { font-size: 0.9rem; color: #666; }

        .legend {
            margin-top: 15px; display: flex; justify-content: center; gap: 20px;
        }
        .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.9rem; }
        .legend-color { width: 15px; height: 15px; border-radius: 50%; }

    </style>
    <link rel="stylesheet" href="global-style.css">
</head>
<body>
    <button class="back-btn" onclick="window.location.href='location.html'">←</button>

    <div class="container">
        <header>
            <h1>Journey History</h1>
            <p>See where you both have been</p>
        </header>

        <div class="controls">
            <button class="btn active" id="btn-24h" onclick="setTimeframe('24h', this)">Last 24 Hours</button>
            <button class="btn" id="btn-1w" onclick="setTimeframe('1w', this)">Past Week</button>
            <button class="btn" id="btn-1m" onclick="setTimeframe('1m', this)">Past Month</button>
            <button class="btn" id="btn-all" onclick="setTimeframe('all', this)">All Time</button>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background: var(--primary-color);"></div>
                <span id="myLegendName">Me</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: var(--secondary-color);"></div>
                <span id="partnerLegendName">Partner</span>
            </div>
        </div>

        <div id="map"></div>

        <div class="stats-panel">
            <div class="stat">
                <div class="stat-val" id="myPoints">0</div>
                <div class="stat-label">My Location Points</div>
            </div>
            <div class="stat">
                <div class="stat-val" id="partnerPoints">0</div>
                <div class="stat-label">Partner Points</div>
            </div>
        </div>
    </div>

    <!-- Leaflet & Ant Path for animated lines -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <!-- Plugin for directed animated lines -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet-ant-path@1.3.0/dist/leaflet-ant-path.min.js"></script>

    <script>
        const firebaseSecretPath = localStorage.getItem('firebase_secret_path') || 'default_fallback';

        const API_URL = "https://shrill-base-9781.dtechxpreas.workers.dev";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBlHyneuosm2zVsAVF_QPKNE5SsWNDUMyc",
            authDomain: "dtech-75e26.firebaseapp.com",
            projectId: "dtech-75e26",
            storageBucket: "dtech-75e26.firebasestorage.app",
            messagingSenderId: "101292842193",
            appId: "1:101292842193:web:d12190895fa7a6b330b9f0",
            measurementId: "G-Z79PVN3V7H"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let localUser = null;
        let map = null;
        let myLayerGroup = L.layerGroup();
        let partnerLayerGroup = L.layerGroup();
        let allData = { mine: [], partner: [] };

        function getPartnerFromLocalStorage() {
            return localUser ? localUser.partner.name.toLowerCase() : null;
        }

        function getCurrentUser() {
            return localUser ? localUser.name.toLowerCase() : null;
        }

        function getCutoffTime(period) {
            const now = Date.now();
            if (period === '24h') return now - (24 * 60 * 60 * 1000);
            if (period === '1w') return now - (7 * 24 * 60 * 60 * 1000);
            if (period === '1m') return now - (30 * 24 * 60 * 60 * 1000);
            return 0; // all time
        }

        function initApp() {
            const savedProfile = localStorage.getItem('togetherProfile');
            if (!savedProfile) {
                window.location.href = 'index.html';
                return;
            }
            localUser = JSON.parse(savedProfile);

            document.getElementById('myLegendName').textContent = localUser.name;
            document.getElementById('partnerLegendName').textContent = localUser.partner.name;

            // Use CartoDB Positron for cleaner look
            map = L.map('map').setView([0, 0], 2);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO'
            }).addTo(map);

            myLayerGroup.addTo(map);
            partnerLayerGroup.addTo(map);

            loadData();
        }

        async function loadData() {
            try {
                const myUserName = getCurrentUser();
                const partnerName = getPartnerFromLocalStorage();

                // Fetch from Firebase
                const myHistorySnapshot = await db.ref(`history/${firebaseSecretPath}/${myUserName}`).once('value');
                const myHistory = myHistorySnapshot.val() || {};
                allData.mine = Object.values(myHistory);

                const partnerHistorySnapshot = await db.ref(`history/${firebaseSecretPath}/${partnerName}`).once('value');
                const partnerHistory = partnerHistorySnapshot.val() || {};
                allData.partner = Object.values(partnerHistory);

                setTimeframe('24h', document.getElementById('btn-24h'));
            } catch(e) {
                console.error(e);
            }
        }

        // Smooth path interpolation function
        // Smooth path interpolation function using Chaikin's algorithm
        function smoothPath(points, iterations=3) {
            if (points.length < 3) return points;

            let smoothed = [...points];
            for (let k = 0; k < iterations; k++) {
                const nextSmoothed = [];
                nextSmoothed.push(smoothed[0]); // Keep the first point

                for (let i = 0; i < smoothed.length - 1; i++) {
                    const p1 = smoothed[i];
                    const p2 = smoothed[i + 1];

                    if (typeof p1.lat !== 'number' || typeof p1.lng !== 'number' ||
                        typeof p2.lat !== 'number' || typeof p2.lng !== 'number') {
                        continue;
                    }

                    const pA = {
                        lat: 0.75 * p1.lat + 0.25 * p2.lat,
                        lng: 0.75 * p1.lng + 0.25 * p2.lng,
                        timestamp: p1.timestamp + 0.25 * (p2.timestamp - p1.timestamp)
                    };
                    const pB = {
                        lat: 0.25 * p1.lat + 0.75 * p2.lat,
                        lng: 0.25 * p1.lng + 0.75 * p2.lng,
                        timestamp: p1.timestamp + 0.75 * (p2.timestamp - p1.timestamp)
                    };

                    nextSmoothed.push(pA);
                    nextSmoothed.push(pB);
                }
                nextSmoothed.push(smoothed[smoothed.length - 1]); // Keep the last point
                smoothed = nextSmoothed;
            }
            return smoothed;
        }

        function setTimeframe(tf, targetElement = null) {
            document.querySelectorAll('.controls .btn').forEach(b => b.classList.remove('active'));
            if (targetElement) {
                targetElement.classList.add('active');
            }

            const cutoff = getCutoffTime(tf);

            let myFiltered = allData.mine.filter(p => p.timestamp >= cutoff);
            let partnerFiltered = allData.partner.filter(p => p.timestamp >= cutoff);

            document.getElementById('myPoints').textContent = myFiltered.length;
            document.getElementById('partnerPoints').textContent = partnerFiltered.length;

            // Apply smoothing
            myFiltered = smoothPath(myFiltered, 3);
            partnerFiltered = smoothPath(partnerFiltered, 3);

            drawPaths(myFiltered, partnerFiltered);
        }

        function drawPaths(myPoints, partnerPoints) {
            myLayerGroup.clearLayers();
            partnerLayerGroup.clearLayers();

            let bounds = [];

            // Helper to draw a directed line
            function renderPath(points, color, group, isDashed=false) {
                if (points.length < 2) return;
                const latlngs = points.map(p => [p.lat, p.lng]);
                bounds.push(...latlngs);

                // Using Ant Path to show movement direction
                const path = L.polyline.antPath(latlngs, {
                    delay: 800,
                    dashArray: [10, 20],
                    weight: 4,
                    color: color,
                    pulseColor: '#FFFFFF',
                    paused: false,
                    reverse: false
                });
                path.addTo(group);

                // Add start/end markers
                const start = points[0];
                const end = points[points.length-1];

                L.circleMarker([start.lat, start.lng], {radius: 5, color: '#000', fillColor: color, fillOpacity:1}).addTo(group).bindPopup(`Start: ${new Date(start.timestamp).toLocaleString()}`);
                L.circleMarker([end.lat, end.lng], {radius: 8, color: '#fff', fillColor: color, fillOpacity:1}).addTo(group).bindPopup(`Latest: ${new Date(end.timestamp).toLocaleString()}`);

                // Add intermediate markers
                for (let i = 1; i < points.length - 1; i++) {
                    const p = points[i];
                    if (p.timestamp) {
                        L.circleMarker([p.lat, p.lng], {
                            radius: 4,
                            color: color,
                            weight: 1,
                            fillColor: '#fff',
                            fillOpacity: 0.8
                        }).addTo(group).bindPopup(`Time: ${new Date(p.timestamp).toLocaleString()}`);
                    }
                }
            }

            // Draw lines
            renderPath(myPoints, 'var(--primary-color)', myLayerGroup);
            renderPath(partnerPoints, 'var(--secondary-color)', partnerLayerGroup);

            if (bounds.length > 0) {
                map.fitBounds(bounds, {padding: [50, 50]});
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <script src="debug-console.js"></script>
    <script src="auth-check.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <link rel="icon" type="image/png" href="logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Together - Location History</title>

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            /* handled by global css */
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            padding: 20px 0;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: var(--secondary-color);
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--card-bg);
            border: none;
            color: var(--secondary-color);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .btn {
            background: var(--card-bg);
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .btn.active {
            background: var(--primary-color);
            color: var(--dark-color);
        }

        #map {
            flex: 1;
            min-height: 500px;
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(166, 94, 166, 0.1);
            z-index: 1;
        }

        .stats-panel {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 15px;
            margin-top: 20px;
            display: flex;
            justify-content: space-around;
            box-shadow: 0 5px 15px rgba(166, 94, 166, 0.1);
        }

        .stat {
            text-align: center;
        }

        .stat-val {
            font-size: 1.5rem;
            color: var(--secondary-color);
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
        }

        .legend {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
        }

        .legend-color {
            width: 15px;
            height: 15px;
            border-radius: 50%;
        }

        /* Custom Popup Styling */
        .leaflet-popup-content-wrapper {
            background: var(--card-bg);
            color: var(--secondary-color);
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(166, 94, 166, 0.2);
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
        }

        .leaflet-popup-tip {
            background: var(--card-bg);
        }

        .leaflet-popup-content {
            margin: 12px;
            font-size: 0.95rem;
            text-align: center;
        }
    </style>

    <link rel="stylesheet" href="global-style.css">
</head>
<body>
    <button class="back-btn" onclick="window.location.href='location.html'">←</button>

    <div class="container">
        <header>
            <h1>Journey History</h1>
            <p>See where you both have been</p>
        </header>

        <div class="controls">
            <button class="btn active" id="btn-24h" onclick="setTimeframe('24h', this)">Last 24 Hours</button>
            <button class="btn" id="btn-1w" onclick="setTimeframe('1w', this)">Past Week</button>
            <button class="btn" id="btn-1m" onclick="setTimeframe('1m', this)">Past Month</button>
            <button class="btn" id="btn-all" onclick="setTimeframe('all', this)">All Time</button>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background: var(--primary-color);"></div>
                <span id="myLegendName">Me</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: var(--secondary-color);"></div>
                <span id="partnerLegendName">Partner</span>
            </div>
        </div>

        <div id="map"></div>

        <div class="stats-panel">
            <div class="stat">
                <div class="stat-val" id="myPoints">0</div>
                <div class="stat-label">My Points</div>
            </div>
            <div class="stat">
                <div class="stat-val" id="myDistance">0 km</div>
                <div class="stat-label">My Distance</div>
            </div>
            <div class="stat">
                <div class="stat-val" id="partnerPoints">0</div>
                <div class="stat-label">Partner Points</div>
            </div>
            <div class="stat">
                <div class="stat-val" id="partnerDistance">0 km</div>
                <div class="stat-label">Partner Distance</div>
            </div>
        </div>
    </div>

    <!-- Leaflet & Ant Path for animated lines -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-ant-path@1.3.0/dist/leaflet-ant-path.min.js"></script>

    <script>
        const firebaseSecretPath = localStorage.getItem('firebase_secret_path') || 'default_fallback';

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBlHyneuosm2zVsAVF_QPKNE5SsWNDUMyc",
            authDomain: "dtech-75e26.firebaseapp.com",
            projectId: "dtech-75e26",
            storageBucket: "dtech-75e26.firebasestorage.app",
            messagingSenderId: "101292842193",
            appId: "1:101292842193:web:d12190895fa7a6b330b9f0",
            measurementId: "G-Z79PVN3V7H"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let localUser = null;
        let map = null;
        let myLayerGroup = L.layerGroup();
        let partnerLayerGroup = L.layerGroup();
        let allData = { mine: [], partner: [] };

        function getPartnerFromLocalStorage() {
            return localUser ? String(localUser.partner.name).toLowerCase() : null;
        }

        function getCurrentUser() {
            return localUser ? String(localUser.name).toLowerCase() : null;
        }

        function getCutoffTime(period) {
            const now = Date.now();
            if (period === '24h') return now - (24 * 60 * 60 * 1000);
            if (period === '1w') return now - (7 * 24 * 60 * 60 * 1000);
            if (period === '1m') return now - (30 * 24 * 60 * 60 * 1000);
            return 0;
        }

        function toNumber(value) {
            const n = Number(value);
            return Number.isFinite(n) ? n : null;
        }

        function normalizePoints(historyObj) {
            const points = Object.values(historyObj || [])
                .map(p => ({
                    lat: toNumber(p.lat),
                    lng: toNumber(p.lng),
                    timestamp: toNumber(p.timestamp)
                }))
                .filter(p =>
                    typeof p.lat === 'number' &&
                    typeof p.lng === 'number' &&
                    typeof p.timestamp === 'number'
                );

            points.sort((a, b) => a.timestamp - b.timestamp);
            return points;
        }

        function initApp() {
            const savedProfile = localStorage.getItem('togetherProfile');
            if (!savedProfile) {
                window.location.href = 'index.html';
                return;
            }

            localUser = JSON.parse(savedProfile);

            document.getElementById('myLegendName').textContent = localUser.name;
            document.getElementById('partnerLegendName').textContent = localUser.partner.name;

            map = L.map('map').setView([0, 0], 2);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            myLayerGroup.addTo(map);
            partnerLayerGroup.addTo(map);

            loadData();
        }

        async function loadData() {
            try {
                const myUserName = getCurrentUser();
                const partnerName = getPartnerFromLocalStorage();

                const myHistorySnapshot = await db.ref(`history/${firebaseSecretPath}/${myUserName}`).once('value');
                const myHistory = myHistorySnapshot.val() || {};
                allData.mine = normalizePoints(myHistory);

                const partnerHistorySnapshot = await db.ref(`history/${firebaseSecretPath}/${partnerName}`).once('value');
                const partnerHistory = partnerHistorySnapshot.val() || {};
                allData.partner = normalizePoints(partnerHistory);

                setTimeframe('24h', document.getElementById('btn-24h'));
            } catch (e) {
                console.error(e);
            }
        }

        function formatAMPM(timestamp) {
            const date = new Date(timestamp);
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const month = months[date.getMonth()];
            const day = date.getDate();
            const year = date.getFullYear();
            let hours = date.getHours();
            let minutes = date.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            return `${month} ${day}, ${year}, ${hours}:${minutes} ${ampm}`;
        }

        function calculateTotalDistance(points) {
            if (points.length < 2) return 0;
            let total = 0;

            for (let i = 0; i < points.length - 1; i++) {
                total += map.distance(
                    [points[i].lat, points[i].lng],
                    [points[i + 1].lat, points[i + 1].lng]
                );
            }

            return total / 1000;
        }

        async function setTimeframe(tf, targetElement = null) {
            document.querySelectorAll('.controls .btn').forEach(b => b.classList.remove('active'));
            if (targetElement) targetElement.classList.add('active');

            const cutoff = getCutoffTime(tf);

            const myFiltered = allData.mine
                .filter(p => p.timestamp >= cutoff)
                .sort((a, b) => a.timestamp - b.timestamp);

            const partnerFiltered = allData.partner
                .filter(p => p.timestamp >= cutoff)
                .sort((a, b) => a.timestamp - b.timestamp);

            document.getElementById('myPoints').textContent = myFiltered.length;
            document.getElementById('partnerPoints').textContent = partnerFiltered.length;
            document.getElementById('myDistance').textContent = calculateTotalDistance(myFiltered).toFixed(2) + ' km';
            document.getElementById('partnerDistance').textContent = calculateTotalDistance(partnerFiltered).toFixed(2) + ' km';

            await drawPaths(myFiltered, partnerFiltered);
        }

        function drawPaths(myPoints, partnerPoints) {
            myLayerGroup.clearLayers();
            partnerLayerGroup.clearLayers();

            const bounds = [];

            function renderPath(points, color, group) {
                if (points.length === 0) return;

                const latlngs = points.map(p => [p.lat, p.lng]);
                if (latlngs.length < 1) return;

                bounds.push(...latlngs);

                if (latlngs.length >= 2) {
                    const path = L.polyline.antPath(latlngs, {
                        delay: 800,
                        dashArray: [10, 20],
                        weight: 2,
                        color: color,
                        pulseColor: '#FFFFFF',
                        paused: false,
                        reverse: false
                    });

                    path.on('click', function(e) {
                        const clickedLat = e.latlng.lat;
                        const clickedLng = e.latlng.lng;

                        let closestPoint = null;
                        let minDistance = Infinity;

                        for (const p of points) {
                            const dist = map.distance([clickedLat, clickedLng], [p.lat, p.lng]);
                            if (dist < minDistance) {
                                minDistance = dist;
                                closestPoint = p;
                            }
                        }

                        if (closestPoint && closestPoint.timestamp) {
                            L.popup()
                                .setLatLng(e.latlng)
                                .setContent(`Time: ${formatAMPM(closestPoint.timestamp)}`)
                                .openOn(map);
                        }
                    });

                    path.addTo(group);
                }

                const start = points[0];
                const end = points[points.length - 1];

                L.circleMarker([start.lat, start.lng], {
                    radius: 5,
                    color: '#000',
                    fillColor: color,
                    fillOpacity: 1
                }).addTo(group).bindPopup(`Start: ${formatAMPM(start.timestamp)}`);

                if (points.length > 1) {
                    L.circleMarker([end.lat, end.lng], {
                        radius: 8,
                        color: '#fff',
                        fillColor: color,
                        fillOpacity: 1
                    }).addTo(group).bindPopup(`Latest: ${formatAMPM(end.timestamp)}`);
                }
            }

            renderPath(myPoints, 'var(--primary-color)', myLayerGroup);
            renderPath(partnerPoints, 'var(--secondary-color)', partnerLayerGroup);

            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [50, 50] });
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>

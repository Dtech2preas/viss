<!DOCTYPE html>
<html lang="en">
<head>
    <script src="debug-console.js"></script>
    <link rel="icon" type="image/png" href="logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Together Forever - Authentication</title>
    <script src="auth-check.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff7eb9;
            --secondary-color: #7e57c2;
            --accent-color: #ff4d8d;
            --light-color: #fff5f9;
            --dark-color: #3a2846;
            --gradient: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--light-color);
            color: var(--dark-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M50 50L0 25L50 0L100 25L50 50Z' fill='%23ff7eb922' /%3E%3C/svg%3E");
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(166, 94, 166, 0.15);
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.8s ease-out;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: var(--gradient);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .heart-icon {
            font-size: 40px;
            color: var(--accent-color);
            margin-bottom: 10px;
            animation: pulse 2s infinite;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: var(--secondary-color);
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--dark-color);
            opacity: 0.8;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark-color);
            font-size: 1.1rem;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e6d4f7;
            border-radius: 10px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(255, 126, 185, 0.3);
        }

        .btn {
            background: var(--gradient);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            width: 100%;
            margin-top: 30px;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(126, 87, 194, 0.3);
        }

        #error-message {
            color: #d32f2f;
            text-align: center;
            margin-top: 15px;
            font-weight: 500;
            min-height: 24px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }


        /* Debug Console Styles */
        .debug-console {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50vh;
            background: rgba(0, 0, 0, 0.9);
            color: #0f0;
            font-family: monospace;
            z-index: 9999;
            flex-direction: column;
            border-top: 2px solid var(--primary-color);
        }

        .debug-header {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #222;
            color: #fff;
        }

        .debug-body {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            font-size: 12px;
        }

        .debug-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .open-logs-btn {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 50%;
            z-index: 9998;
            cursor: pointer;
            font-size: 12px;
        }

    </style>
<link rel="stylesheet" href="global-style.css">
</head>
<body>

    <div class="container">
        <header>
            <div class="heart-icon">❤</div>
            <h1>Our Secret Space</h1>
            <p class="subtitle">Please answer the questions below to access</p>
        </header>

        <form id="auth-form">
            <div class="form-group">
                <label for="q1">1. Who are you?</label>
                <input type="text" id="q1" required placeholder="Your name...">
            </div>

            <div class="form-group">
                <label for="q2">2. Who is your partner's first name?</label>
                <input type="text" id="q2" required placeholder="Partner's name...">
            </div>

            <div class="form-group">
                <label for="q3">3. What's our combined age?</label>
                <input type="text" id="q3" required placeholder="Combined age...">
            </div>

            <div class="form-group">
                <label for="q4">4. What are Jonas's 2 favourite colours?</label>
                <input type="text" id="q4" required placeholder="Colours...">
            </div>

            <button type="submit" class="btn" id="submit-btn">Unlock</button>
            <div id="error-message"></div>
        </form>
    </div>

    <script>
        const API_URL = 'https://shrill-base-9781.dtechxpreas.workers.dev';

        async function generateHash(q1, q2, q3) {
            const rawString = `${q1.toLowerCase().trim()}_${q2.toLowerCase().trim()}_${q3.toLowerCase().trim()}`;
            const msgBuffer = new TextEncoder().encode(rawString);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        document.getElementById('auth-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const btn = document.getElementById('submit-btn');
            const errorDiv = document.getElementById('error-message');

            const answers = {
                q1: document.getElementById('q1').value,
                q2: document.getElementById('q2').value,
                q3: document.getElementById('q3').value,
                q4: document.getElementById('q4').value
            };

            btn.textContent = 'Checking...';
            btn.disabled = true;
            errorDiv.textContent = '';

            try {
                const response = await fetch(`${API_URL}/api/auth`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(answers)
                });

                const data = await response.json();

                if (data.success && data.token) {
                    localStorage.setItem('together_auth_token', data.token);

                    // Generate secret hash and save it
                    const secretHash = await generateHash(answers.q1, answers.q2, answers.q3);
                    localStorage.setItem('firebase_secret_path', secretHash);

                    window.location.href = 'you.html';
                } else {
                    errorDiv.textContent = data.message || 'Incorrect answers. Please try again.';
                }
            } catch (err) {
                errorDiv.textContent = 'Connection error. Please try again.';
                console.error(err);
            } finally {
                btn.textContent = 'Unlock';
                btn.disabled = false;
            }
        });
    </script>

    <!-- Debug Console UI -->
    <button class="open-logs-btn" onclick="toggleDebugConsole()">🐛</button>

    <div class="debug-console" id="debugConsole">
        <div class="debug-header">
            <span>System Logs</span>
            <div>
                <button class="debug-btn" onclick="copyLogs()">Copy</button>
                <button class="debug-btn" onclick="clearLogs()">Clear</button>
                <button class="debug-btn" onclick="toggleDebugConsole()">Close</button>
            </div>
        </div>
        <div class="debug-body" id="debugBody">
            <!-- Logs will appear here -->
        </div>
    </div>

    <script>
        const debugBody = document.getElementById('debugBody');
        const debugConsole = document.getElementById('debugConsole');
        let logs = JSON.parse(localStorage.getItem('systemLogs') || '[]');

        function renderLogs() {
            debugBody.innerHTML = '';
            logs.forEach(log => {
                const div = document.createElement('div');
                div.textContent = `[${new Date(log.timestamp).toLocaleTimeString()}] ${log.tag}: ${log.message}`;
                debugBody.appendChild(div);
            });
            debugBody.scrollTop = debugBody.scrollHeight;
        }

        function toggleDebugConsole() {
            debugConsole.style.display = debugConsole.style.display === 'flex' ? 'none' : 'flex';
            if (debugConsole.style.display === 'flex') {
                renderLogs();
            }
        }

        function copyLogs() {
            const text = logs.map(l => `[${new Date(l.timestamp).toLocaleTimeString()}] ${l.tag}: ${l.message}`).join('\n');
            navigator.clipboard.writeText(text).then(() => {
                alert('Logs copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy', err);
                alert('Failed to copy logs');
            });
        }

        function clearLogs() {
            logs = [];
            localStorage.setItem('systemLogs', JSON.stringify(logs));
            renderLogs();
        }

        window.receiveAndroidLog = function(logData) {
            logs.push(logData);
            if (logs.length > 500) logs.shift(); // Keep max 500 logs
            localStorage.setItem('systemLogs', JSON.stringify(logs));

            if (debugConsole.style.display === 'flex') {
                const div = document.createElement('div');
                div.textContent = `[${new Date(logData.timestamp).toLocaleTimeString()}] ${logData.tag}: ${logData.message}`;
                debugBody.appendChild(div);
                debugBody.scrollTop = debugBody.scrollHeight;
            }
        };

        // Render initial
        renderLogs();
    </script>

</body>
</html>
